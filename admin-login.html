<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ek estates</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo">
        <img class="login-logo" src="Option%204%20-%20Wordmark%402x.png" alt="ek real estate logo">
        <p class="subtitle">LOGIN</p>
      </div>

      <div id="loginAlert"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="username" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to Website</a>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script>
    (async () => {
      if (isLoggedIn()) window.location.href = 'admin.html';
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const ok = await login(email, password);
      if (ok) {
        window.location.href = 'admin.html';
      } else {
        document.getElementById('loginAlert').innerHTML = '<div class="alert alert-error">Invalid email or password.</div>';
      }
    }
  </script>
</body>
</html>
